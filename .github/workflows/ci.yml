name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run it interrupted: the integration job holds real
# containers, and two of them racing for the same runner buys nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: types, lint, unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The same major the project is developed on, read from .nvmrc so
          # there is one place to change it.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: formatting
        run: npm run format:check

      # With coverage, because the thresholds are part of the contract: the
      # unit suite answers for the domain, and a drop there should fail the
      # build rather than be noticed later.
      - name: unit tests
        run: npm run test:cov -- --reporter=json --reporter=default --outputFile=/tmp/unit.json

      # The README says how many tests there are, and that is a number which
      # goes stale on the next commit — it already had, twice. Checked where it
      # is produced rather than remembered.
      - name: the README's test count is the real one
        run: node --import tsx tools/check-doc-counts.ts /tmp/unit.json "юнит-тест"

  integration:
    name: integration (real Postgres and RabbitMQ)
    runs-on: ubuntu-latest
    # Containers, a TTL retry hop and a severed connection to recover from:
    # this is minutes, not seconds, and that is the point of it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Testcontainers starts its own Postgres and RabbitMQ against the
      # runner's Docker daemon; docker-compose.yml is deliberately not used, so
      # a test run and a local stack can never interfere.
      - name: integration tests
        run: npm run test:integration -- --reporter=json --reporter=default --outputFile=/tmp/integration.json

      - name: the README's integration count is the real one
        run: |
          node --import tsx tools/check-doc-counts.ts /tmp/integration.json \
            "тестов на настоящих Postgres и RabbitMQ"

  image:
    name: image builds and runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Builds the image and brings up the whole stack: a successful build
      # proves the Dockerfile compiles, and `--wait` proves the service became
      # healthy, which means it reached both the database and the broker.
      - name: build and start the stack
        run: docker compose up -d --wait

      - name: migrations ran as their own step
        run: |
          docker compose logs migrate
          test "$(docker compose ps -a --status exited --format '{{.Service}}' | grep -c '^migrate$')" = 1

      - name: endpoints answer
        run: |
          curl -fsS localhost:3000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -o /dev/null localhost:3000/api/docs-json
          curl -fsS localhost:3000/metrics | grep -q bet_events_acknowledged_total
          curl -fsS localhost:3000/leaderboard | grep -q '"tournament"'

      # The runtime image deletes typescript, ts-node and @swc/core, which
      # `typeorm` and `@nestjs/swagger` drag in but do not need once compiled.
      # Both halves of that claim are checked: that they are gone, and that
      # nothing needs them — `/api/docs-json` above is the Swagger path, the
      # one that would fail with MODULE_NOT_FOUND where local dev works.
      - name: the runtime image carries no build tooling
        run: |
          docker compose run --rm --no-deps --entrypoint sh app -c '
            for gone in typescript ts-node @swc/core; do
              if [ -e "node_modules/$gone" ]; then
                echo "node_modules/$gone is still in the runtime image" >&2
                exit 1
              fi
            done
            echo "typescript, ts-node and @swc/core are absent, as intended"
          '

      # Booting is not the job. An event published straight into the broker's
      # management API — no dependencies on the runner — has to come out of the
      # image as points, with the money arithmetic intact: 10.40 EUR at 1.08 is
      # 11.232 and not 11.23.
      - name: the image scores a bet, not just answers
        run: |
          BODY='{\"betId\":\"aa111111-1111-4111-8111-111111111111\",\"playerId\":\"bb222222-2222-4222-8222-222222222222\",\"currency\":\"EUR\",\"stake\":\"10.0000\",\"winAmount\":\"10.4000\",\"settledAt\":\"2026-11-15T12:00:00.000Z\"}'
          curl -fsS -u tournament:tournament -X POST -H 'content-type: application/json' \
            -d "{\"properties\":{\"delivery_mode\":2},\"routing_key\":\"bet.settled\",\"payload\":\"$BODY\",\"payload_encoding\":\"string\"}" \
            http://localhost:15672/api/exchanges/%2F/bets/publish | grep -q '"routed":true'

          for attempt in $(seq 1 30); do
            if curl -fsS localhost:3000/leaderboard | grep -q '"pointsExact":"11.232000"'; then
              echo "scored 11.232000 for 10.40 EUR at 1.08"
              curl -fsS localhost:3000/metrics | grep 'bet_events_acknowledged_total{reason="scored"}'
              exit 0
            fi
            sleep 1
          done
          echo "the image did not score the event within 30s" >&2
          curl -fsS localhost:3000/leaderboard >&2
          exit 1

      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: stop the stack
        if: always()
        run: docker compose down -v
